# resumix model configuration
# =============================
# resumix calls exactly five models, one per job, all through the SAME
# provider — unless a model sets use_alternate_provider = N (N >= 2), in which
# case it calls provider N instead: [provider]'s variable names with N
# appended, e.g. MODEL_API_KEY2 / MODEL_BASE_URL2 for 2:
#
#   detect     JD detection: is the clipboard a job posting at all?
#   summary    JD analysis and the cover letter
#   cv         CV writing
#   review     the content review of each CV against the master profile
#   highlight  the **bold**/*italic* keyword pass over the validated CV
#
# [provider] declares the endpoint once; each [models.*] table below is just
# the model name and generation settings for that job. Any OpenAI-compatible
# /chat/completions endpoint works — point base_url (or base_url_env) at it
# and set each model's `model` to whatever your account has access to.
#
# Docker: model, temperature, thinking, reasoning_effort, thinking_budget,
# structured_output and use_alternate_provider can each be overridden per role
# with an env var, without touching this file — RESUMIX_<ROLE>_<FIELD>, e.g.
# RESUMIX_CV_MODEL, RESUMIX_CV_TEMPERATURE, RESUMIX_CV_THINKING,
# RESUMIX_CV_STRUCTURED_OUTPUT, RESUMIX_CV_USE_ALTERNATE_PROVIDER (roles:
# DETECT, SUMMARY, CV, REVIEW, HIGHLIGHT). RESUMIX_<ROLE>_THINKING_BUDGET= (empty)
# unsets a budget declared below, which is how RESUMIX_<ROLE>_REASONING_EFFORT
# wins back the request — see the note above use_alternate_provider. See
# .env.example.

[provider]
api_key_env  = "MODEL_API_KEY"
base_url_env = "MODEL_BASE_URL"

[defaults]
timeout_seconds = 600

# --- Per-model settings -------------------------------------------------
# model           (required) model name sent to the endpoint
# temperature     sampling temperature; omit to use the provider default
# max_tokens      overrides [defaults].max_tokens for this model; omitted here
#                 and in [defaults] means max_tokens is left out of the request
#                 entirely and the provider's own default applies. Set it when
#                 the endpoint caps completion tokens (e.g. DashScope's
#                 max_tokens range is [1, 8192] for some models)
# reasoning_effort  "low" | "medium" | "high"; omit for the provider default
# thinking        "auto" (send nothing — the provider decides, and the right
#                 value for endpoints that reject a thinking switch, e.g.
#                 OpenAI) | "on" (enable_thinking, plus `thinking_budget` when
#                 set) | "off" (force reasoning off)
# thinking_budget cap on reasoning tokens per call; needs thinking = "on"
# web_search      true when the endpoint runs web search server-side
# structured_output  "json_schema_strict" (endpoint validates the schema and
#                   rejects anything off it) | "json_schema" (schema sent as a
#                   hint) | "json_object" (JSON but no schema) | "none".
#                   resumix also restates the schema in the prompt and
#                   validates every reply, so "json_object" still works.
# use_alternate_provider  which provider to call; default 1 ([provider]).
#                 N >= 2 calls MODEL_API_KEY<N> / MODEL_BASE_URL<N> instead;
#                 those are needed only when some model uses them
# Note: reasoning_effort and thinking_budget are mutually exclusive — a
# declared thinking_budget always wins and reasoning_effort is dropped.

# Small and cheap: answers YES or NO to "is this a job description?". Runs on
# every clipboard change that passes the free structural checks, so it gets
# no thinking and a tiny budget — the verdict is one word. structured_output =
# "none": the reply is text, not JSON.
[models.detect]
model             = "qwen3.8-flash"
structured_output = "none"
max_tokens        = 100
thinking          = "off"

# Mid-size: extracts the JD analysis and writes the cover letter. The only
# model allowed to run web research (on the employer, for a direct posting
# from a named company).
[models.summary]
model             = "qwen3.8-flash"
structured_output = "json_object"
temperature       = 0.1
thinking          = "on"
reasoning_effort  = "low"
# DashScope runs web search server-side via extra_body {"enable_search": true}.
web_search        = true

# The large one: writes the tailored CV. Thinking is worth
# paying for here, capped so a long reasoning chain cannot eat the output
# budget and truncate the JSON.

[models.cv]
model             = "qwen3.8-max-0902"
structured_output = "json_schema_strict"
max_tokens        = 17000
thinking          = "on"
thinking_budget   = 6500

# The judge: reads the CV against the master profile and answers in plain
# text, one violation per line — an empty reply when there is nothing to fix.
# The same large model the CV is written with, so the reviewer is never weaker
# than the writer. structured_output = "none": the reply is text, not JSON.
# temperature = 0 is load-bearing: a reviewer that samples draws a different
# set of violations every round, and the loop never settles.
[models.review]
model             = "qwen3.8-max"
structured_output = "none"
temperature       = 0.0
max_tokens        = 9000
thinking          = "on"
thinking_budget   = 6500

# Mid-size, no thinking: the highlighter only inserts Markdown markers into
# already-validated JSON. Letting a hybrid-reasoning model think about that
# burns the whole output budget on reasoning tokens and returns truncated JSON.
[models.highlight]
model             = "qwen3.8-flash"
structured_output = "json_object"
temperature       = 0.1
thinking          = "off"


