# The doc/ folder, as a site.
#
#     uv run --group docs mkdocs serve     live preview on http://localhost:8000
#     uv run --group docs mkdocs build     static HTML into site/
#
# Versions are pinned in pyproject.toml's `docs` group: MkDocs 1.x and Material
# 9.x. Material is what renders the mermaid fences and the theming below; a
# plain mkdocs theme would print the diagrams as code blocks.
site_name: resumix
site_description: Turn a job description into a tailored LaTeX CV, with any OpenAI-compatible model.
repo_url: https://github.com/gcontini/resumix
# Where the built site lives. mike needs it for the version selector's links.
site_url: https://gcontini.github.io/resumix/
docs_dir: doc

# A broken internal link fails the build rather than shipping.
strict: true

theme:
  name: material
  # doc/images/, not doc/icons/ — strict mode checks links, not asset paths,
  # so a wrong one here is a 404 on every page and a green build.
  logo: images/resumix-icon-128.png
  favicon: images/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - content.code.copy

# The version selector in the header. mike publishes one built site per
# release to the gh-pages branch and maintains the versions.json this reads;
# `alias: true` is what makes the `latest` chip show next to the number.
# See doc/release.md.
extra:
  version:
    provider: mike
    alias: true

markdown_extensions:
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - resumix: index.md
  - How it works:
      - Architecture: architecture.md
      - The CV pipeline: cv-pipeline.md
      - A run, end to end: clipboard-flow.md
  - Using it:
      - The client: client.md
      - Running the two halves apart: deployment.md
  - Reference:
      - The HTTP API: protocol.md
      - Building the server: build-server.md
      - Building the client: build-client.md
      - Cutting a release: release.md
